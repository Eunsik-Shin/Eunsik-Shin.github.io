# About Section
about_title: About
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  Hello! My name is Eunsik Shin. I am a Ph.D student at <a href="https://www.notion.so/snu-marg/MARG-091390162ca941f4b88f64d47d2c4e87">Music ant Audio Research Group (MARG)</a> in Seoul National University, which is led by professor <a href="https://scholar.google.com/citations?user=Fk4jQFEAAAAJ&hl=ko&oi=ao">Kyogu Lee</a>. 
  
  My research interests are mainly focused on <mark>music information retrieval</mark>. In particular, I am studying and working on <mark>text-to-music tasks</mark>, <mark>music representation learning</mark>, especially dealing with related topics like explanability, granularity and reasoning. 

  I also have huge interest in Human-Computer-Interaction topics that involves music in any way.
  
  Apart from these, I am very open to other research topics related to audio.

  <a href="{{ site.baseurl }}/assets/CV_Updated_2024_09_22.pdf">Here</a> you can find my CV. Feel free to contact me if you have any questions or want to collaborate.

